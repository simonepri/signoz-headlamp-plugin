install: |
  On desktop, install from the Plugin Catalog, then open Settings for this
  plugin and enter your SigNoz base URL. Links appear after a reload.

  In-cluster, supply a `config.json` instead:

  - Add an init container to your Headlamp Helm values that downloads the
    release archive, verifies the checksum above, and unpacks it into the
    shared plugins directory.
  - Serve `config.json` next to the extracted plugin, at
    `static-plugins/signoz-observability-links/config.json`, usually from a ConfigMap.
  - A deployed `config.json` overrides per-user settings, so the origin
    allowlist stays an administrator decision.

  Without either source the plugin renders nothing, by design. See the
  repository README for the configuration schema and a runnable kind demo.
readme: |
  # SigNoz links for Headlamp

  Adds Logs, Metrics, Traces, and Errors links to Kubernetes resource views.
  Links open SigNoz in a new tab, where you authenticate as usual. The plugin
  has no API client, no proxy, and no credentials, and it only reads the
  resource Headlamp already fetched.

  Links appear on Pods, workloads, Namespaces, and Nodes. Each view queries its
  own scope, and Errors is the traces explorer narrowed to error spans.

  Queries use the standard OpenTelemetry Kubernetes attributes, so your
  collector must set them for links to resolve to data.

  A missing or invalid config, a non-HTTPS destination other than browser
  loopback, an origin outside the allowlist, or a window outside 5 to 360
  minutes all render no links.
