apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        demo.simonepri.dev/run-id: run-20260823
    spec:
      containers:
        - name: api
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nightly-etl
  namespace: demo
spec:
  template:
    metadata:
      labels:
        demo.simonepri.dev/run-id: run-20260823
    spec:
      restartPolicy: Never
      containers:
        - name: etl
          image: registry.k8s.io/pause:3.10
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-rollup
  namespace: demo
spec:
  schedule: "0 3 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            demo.simonepri.dev/run-id: run-20260823
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: registry.k8s.io/pause:3.10
